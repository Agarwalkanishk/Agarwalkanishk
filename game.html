<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Whack-a-Mole // Kanishk</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: #080808;
      color: #c8c8c8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    #back-link {
      position: fixed;
      top: 16px; left: 20px;
      font-size: 11px;
      color: #444;
      text-decoration: none;
      letter-spacing: 1px;
      transition: color 0.15s;
    }
    #back-link:hover { color: #3ef0a0; }

    #wam {
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      width: 100%;
      max-width: 520px;
      overflow: hidden;
    }

    #wam-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid #1f1f1f;
      background: #111;
    }

    #wam-title {
      font-size: 12px;
      font-weight: 700;
      color: #FF2E63;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #wam-stats {
      display: flex;
      gap: 20px;
    }

    .stat {
      font-size: 11px;
      color: #555;
      letter-spacing: 1px;
    }

    .stat span {
      color: #eee;
      font-weight: 700;
      margin-left: 5px;
    }

    #wam-timer-bar-wrap {
      height: 2px;
      background: #1a1a1a;
    }

    #wam-timer-bar {
      height: 100%;
      width: 100%;
      background: #3ef0a0;
      transition: width 0.2s linear, background 0.4s;
    }

    #wam-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: #1a1a1a;
      margin: 16px 18px;
      border: 1px solid #1f1f1f;
      border-radius: 4px;
      overflow: hidden;
    }

    .hole-cell {
      background: #0d0d0d;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: background 0.1s;
    }

    .hole-cell:hover { background: #111; }

    .hole-inner {
      width: 72%;
      height: 72%;
      border-radius: 50%;
      background: #0a0a0a;
      border: 1px solid #1e1e1e;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .mole-art {
      position: absolute;
      bottom: -100%;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: bottom 0.16s cubic-bezier(.34,1.4,.64,1);
      pointer-events: none;
    }

    .hole-cell.active .mole-art { bottom: 0; }

    .mole-ascii {
      font-size: 9px;
      line-height: 1.3;
      color: #3ef0a0;
      text-align: center;
      white-space: pre;
      letter-spacing: 0.5px;
    }

    .hole-cell.whacked .hole-inner { border-color: #FF2E63; }

    .hit-flash {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(255,46,99,0.15);
      opacity: 0;
      pointer-events: none;
    }

    .hole-cell.whacked .hit-flash {
      animation: flashout 0.3s ease-out forwards;
    }

    @keyframes flashout {
      0%   { opacity: 1; }
      100% { opacity: 0; }
    }

    .corner-tag {
      position: absolute;
      top: 4px; left: 5px;
      font-size: 8px;
      color: #222;
      letter-spacing: 0.5px;
      pointer-events: none;
    }

    #wam-log {
      margin: 0 18px 10px;
      font-size: 10px;
      color: #2b2b2b;
      letter-spacing: 0.5px;
      border-top: 1px solid #161616;
      padding-top: 8px;
      display: flex;
      gap: 8px;
    }

    #wam-log .green { color: #3ef0a0; }
    #log-msg { color: #333; }

    #wam-bottom {
      padding: 12px 18px 16px;
      border-top: 1px solid #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    #wam-msg {
      font-size: 11px;
      color: #444;
      letter-spacing: 1px;
      flex: 1;
    }

    #wam-msg.active-msg { color: #3ef0a0; }

    #wam-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: transparent;
      color: #FF2E63;
      border: 1px solid #FF2E63;
      border-radius: 3px;
      padding: 7px 18px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    #wam-btn:hover:not(:disabled) {
      background: #FF2E63;
      color: #0d0d0d;
    }

    #wam-btn:disabled { opacity: 0.3; cursor: default; }

    #wam-footer {
      margin-top: 18px;
      font-size: 10px;
      color: #2a2a2a;
      letter-spacing: 1px;
      text-align: center;
    }

    #wam-footer a { color: #333; text-decoration: none; }
    #wam-footer a:hover { color: #FF2E63; }
  </style>
</head>
<body>

<a id="back-link" href="https://github.com/YOUR_USERNAME">← github.com/YOUR_USERNAME</a>

<div id="wam">
  <div id="wam-header">
    <div id="wam-title">whack_a_mole.exe</div>
    <div id="wam-stats">
      <div class="stat">SCORE<span id="score-val">00</span></div>
      <div class="stat">BEST<span id="best-val">00</span></div>
    </div>
  </div>

  <div id="wam-timer-bar-wrap">
    <div id="wam-timer-bar"></div>
  </div>

  <div id="wam-grid"></div>

  <div id="wam-log">
    <span class="green">[sys]</span>
    <span id="log-msg">awaiting input...</span>
  </div>

  <div id="wam-bottom">
    <div id="wam-msg">// press start</div>
    <button id="wam-btn">[ START ]</button>
  </div>
</div>

<div id="wam-footer">built by <a href="https://github.com/YOUR_USERNAME">kanishk</a> · whack_a_mole v1.0</div>

<script>
(function(){
  const HOLES = 9;
  const GAME_DURATION = 30;
  const grid = document.getElementById('wam-grid');

  const MOLE_FACES = [
    " /\\_/\\\n( o.o )\n > ^ <",
    " /\\_/\\\n( >.< )\n > ^ <",
    " /\\_/\\\n( ^.^ )\n > ^ <",
  ];

  let score = 0, best = 0, active = false;
  let moleTimers = [], interval = null;

  const scoreEl  = document.getElementById('score-val');
  const bestEl   = document.getElementById('best-val');
  const msgEl    = document.getElementById('wam-msg');
  const btn      = document.getElementById('wam-btn');
  const bar      = document.getElementById('wam-timer-bar');
  const logMsg   = document.getElementById('log-msg');

  for (let i = 0; i < HOLES; i++) {
    const cell = document.createElement('div');
    cell.className = 'hole-cell';
    cell.id = 'hole' + i;
    const row = Math.floor(i / 3), col = i % 3;
    cell.innerHTML = `
      <span class="corner-tag">[${row},${col}]</span>
      <div class="hole-inner">
        <div class="mole-art" id="mole${i}">
          <div class="mole-ascii">${MOLE_FACES[i % 3]}</div>
        </div>
        <div class="hit-flash" id="flash${i}"></div>
      </div>`;
    cell.addEventListener('click', () => whack(i));
    grid.appendChild(cell);
  }

  function pad(n) { return String(n).padStart(2, '0'); }
  function setLog(msg) { logMsg.textContent = msg; }

  function whack(i) {
    if (!active) return;
    const cell = document.getElementById('hole' + i);
    if (!cell.classList.contains('active')) return;
    cell.classList.remove('active');
    cell.classList.add('whacked');
    const flash = document.getElementById('flash' + i);
    flash.style.animation = 'none';
    void flash.offsetWidth;
    flash.style.animation = '';
    setTimeout(() => cell.classList.remove('whacked'), 300);
    score++;
    scoreEl.textContent = pad(score);
    if (score > best) { best = score; bestEl.textContent = pad(best); }
    const logs = ['> hit registered', '> target eliminated', '> nice shot', '> combo++', '> mole terminated'];
    setLog(logs[Math.min(score - 1, logs.length - 1)]);
    msgEl.textContent = score < 5 ? '// warming up' : score < 15 ? '// on a streak' : score < 25 ? '// unstoppable' : '// god mode';
  }

  function showMole() {
    if (!active) return;
    const idx = Math.floor(Math.random() * HOLES);
    const cell = document.getElementById('hole' + idx);
    if (cell.classList.contains('active') || cell.classList.contains('whacked')) return;
    cell.classList.add('active');
    const speed = score < 10 ? 900 : score < 20 ? 680 : 520;
    const t = setTimeout(() => cell.classList.remove('active'), speed);
    moleTimers.push(t);
  }

  function startGame() {
    score = 0;
    scoreEl.textContent = '00';
    active = true;
    btn.textContent = '[ ... ]';
    btn.disabled = true;
    msgEl.textContent = '// go go go';
    msgEl.className = 'active-msg';
    bar.style.width = '100%';
    bar.style.background = '#3ef0a0';
    setLog('game started — whack the moles!');

    for (let i = 0; i < HOLES; i++) {
      document.getElementById('hole' + i).classList.remove('active', 'whacked');
    }
    moleTimers.forEach(clearTimeout);
    moleTimers = [];

    const spawnId = setInterval(() => {
      if (!active) { clearInterval(spawnId); return; }
      showMole();
      if (Math.random() < 0.45) showMole();
    }, 580);
    moleTimers.push(spawnId);

    let elapsed = 0;
    interval = setInterval(() => {
      elapsed += 0.2;
      const pct = Math.max(0, 1 - elapsed / GAME_DURATION);
      bar.style.width = (pct * 100) + '%';
      bar.style.background = pct < 0.25 ? '#FF2E63' : pct < 0.5 ? '#f5a623' : '#3ef0a0';
      if (elapsed >= GAME_DURATION) {
        clearInterval(interval);
        clearInterval(spawnId);
        endGame();
      }
    }, 200);
  }

  function endGame() {
    active = false;
    for (let i = 0; i < HOLES; i++) {
      document.getElementById('hole' + i).classList.remove('active', 'whacked');
    }
    moleTimers.forEach(clearTimeout);
    const rating = score >= 25 ? 'S' : score >= 15 ? 'A' : score >= 5 ? 'B' : 'C';
    msgEl.textContent = `// game over — rank ${rating}`;
    msgEl.className = '';
    setLog(`session ended › score: ${pad(score)} › rating: ${rating}`);
    btn.textContent = '[ RETRY ]';
    btn.disabled = false;
  }

  btn.addEventListener('click', startGame);
})();
</script>
</body>
</html>
